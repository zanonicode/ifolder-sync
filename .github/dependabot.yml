# Dependabot keeps GitHub Actions and Python deps current (Phase 0 deterministic
# baseline, DESIGN_03 Decision 9). Updates are grouped per ecosystem into a single
# weekly PR, so two bumps never collide editing the same file (as checkout +
# setup-python did on the first run).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
