name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly canary against the latest in-range pyicloud
  workflow_dispatch:

jobs:
  build:
    name: build & install gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: install wheel and smoke-test the CLI
        run: |
          python -m pip install dist/*.whl
          ifolder-sync --help
          python -m pip show ifolder-sync

  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check ifolder_sync tests
      - run: ruff format --check ifolder_sync tests
      - run: mypy ifolder_sync tests
      - run: pytest --cov=ifolder_sync --cov-report=term --cov-fail-under=65

  canary:
    name: pyicloud canary (latest in-range)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -e ".[dev]"
      - run: python scripts/pyicloud_canary.py
      - run: pytest -q
