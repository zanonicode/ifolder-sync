name: ai-eval

# Gates the Invariant Guardian's prompt quality (NOT merges): runs the reviewer over the
# golden fixtures and enforces recall / false-positive / run-twice-consistency. Advisory.
on:
  pull_request:
    paths: ["scripts/ai_guardian/**", "evals/**", ".github/workflows/ai-eval.yml"]
  schedule:
    - cron: "0 6 * * 1" # weekly drift catch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # Same-repo only (never forks — the SUT uses WIF, the judge uses a secret), and only
    # when the Vertex repo vars exist. The ANTHROPIC_API_KEY secret cannot be tested in an
    # `if:` (secrets are not available there), so the run step skips cleanly if it is unset.
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Vertex WIF (the system-under-test)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -e ".[ai]"

      - name: fixture integrity (the #1 silent-rot guard)
        run: |
          for d in evals/fixtures/*/diff.patch; do
            git apply --check "$d" || { echo "STALE FIXTURE: $d"; exit 1; }
          done

      - name: regenerate the system prompt from invariants.yaml (no drift)
        run: |
          mkdir -p evals/prompts
          python - <<'PY'
          from scripts.ai_guardian.prompt import build_system_prompt, fence_diff, load_invariants

          text = build_system_prompt(load_invariants()) + "\n\n" + fence_diff("{{diff}}") + "\n"
          with open("evals/prompts/guardian-system.txt", "w") as fh:
              fh.write(text)
          PY

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.VERTEX_SA }}

      - run: npm install -g promptfoo@0.121.15

      - name: eval twice (non-determinism can never wedge the gate)
        working-directory: evals
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          VERTEX_PROJECT_ID: ${{ vars.GCP_PROJECT }}
          VERTEX_REGION: us-central1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY unset; skipping the eval (set it to enable the judge)."
            exit 0
          fi
          # promptfoo exits 100 if any per-test assert fails; that is informational here
          # (it feeds the HTML report). The AUTHORITATIVE gate is assert_consistent.py
          # (recall / false-positive / run-twice consistency), so let both runs complete.
          promptfoo eval -c promptfooconfig.yaml -o /tmp/run1.json || true
          promptfoo eval -c promptfooconfig.yaml -o /tmp/run2.json || true
          python assert_consistent.py /tmp/run1.json /tmp/run2.json --fixtures fixtures

      - name: html report
        if: ${{ always() }}
        working-directory: evals
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          VERTEX_PROJECT_ID: ${{ vars.GCP_PROJECT }}
          VERTEX_REGION: us-central1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            promptfoo eval -c promptfooconfig.yaml --output report.html || true
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: eval-report
          path: evals/report.html
          if-no-files-found: ignore
