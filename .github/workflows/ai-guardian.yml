name: ai-guardian

# Lane 2 — Invariant Guardian (DESIGN_03 Pattern 2). ADVISORY: comment-only, never a
# required check; the run step always exits 0. Keyless Vertex auth via Workload Identity
# Federation (Decision 3). Gated to same-repo PRs (Decision 11) — fork PRs never reach the
# OIDC/comment job — and additionally skips cleanly when the WIF vars are unconfigured.

on:
  pull_request:                 # NEVER pull_request_target (Decision 11)
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-guardian-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read                # top-level least privilege; jobs escalate explicitly

jobs:
  guardian:
    # same-repo only (no forks) AND skip cleanly when WIF is unconfigured
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.GCP_PROJECT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write       # upsert the advisory comment
      id-token: write            # Vertex WIF OIDC
    steps:
      - uses: actions/checkout@v6        # MUST precede auth (auth writes gha-creds-*.json into the workspace)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[ai]"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}   # projects/<NUMBER>/locations/global/workloadIdentityPools/.../providers/...
          service_account: ${{ vars.VERTEX_SA }}                 # roles/aiplatform.user only
      - name: run guardian (advisory; always exits 0)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          MAX_DIFF_BYTES: "200000"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.ai_guardian.review
