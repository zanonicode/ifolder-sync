[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ifolder-sync"
version = "0.8.2"
description = "Bidirectional sync daemon between a specific iCloud Drive folder and a local folder on macOS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Vitor Zanoni" }]
keywords = ["icloud", "icloud-drive", "sync", "obsidian", "macos", "daemon", "launchd", "pyicloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Utilities",
]
dependencies = [
    "pyicloud>=2.0.0,<3",
    "watchdog>=3.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.0,<2",
]

[project.scripts]
ifolder-sync = "ifolder_sync.cli:main"

[project.urls]
Homepage = "https://github.com/zanonicode/ifolder-sync"
Issues = "https://github.com/zanonicode/ifolder-sync/issues"
Changelog = "https://github.com/zanonicode/ifolder-sync/releases"

[tool.setuptools.packages.find]
include = ["ifolder_sync*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
